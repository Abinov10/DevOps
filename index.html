<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry | Minimalist Time</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;300;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="aura-container">
        <div class="aura" id="aura"></div>
    </div>
    <h1>Good Time Only</h1>
    <main class="clock-content">
        <div class="time-display">
            <span id="hours">00</span>
            <span class="separator">:</span>
            <span id="minutes">00</span>
        </div>
        <div class="date-display" id="date">-- ---, ----</div>
    </main>

    <div class="seconds-ring" id="seconds-ring"></div>

    <script src="script.js"></script>
</body>
</html>
